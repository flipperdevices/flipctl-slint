version = 1

# Everything in this repository that we author is MIT-licensed. Files that cannot
# carry an SPDX header (configs, lockfiles, shell scripts, assets) are covered
# here.
#
# The crates linked into the binary are NOT files in this tree, so REUSE does not
# (and cannot) cover them: their full license texts are collected in
# THIRD-PARTY-LICENSES.md, generated by scripts/gen-third-party-licenses.sh.
# Because the binary links Slint under GPL-3.0, the distributed binary as a whole
# is GPL-3.0-only; our own source stays MIT (GPL-compatible).
#
# The three pixel fonts in third_party/flipctl-fonts are vendored files here
# rather than a submodule, so they are annotated below, each under its own terms.
# One of them, HaxrCorp 4090, is CC BY-SA 3.0: the Rust glyph table generated from
# it carries those terms too, which is why src/font/title.rs is not MIT.

[[annotations]]
path = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    ".gitignore",
    "REUSE.toml",
    "about.toml",
    "about.hbs",
    "run_me.sh",
    "build_deploy.sh",
    "bin/**",
    "crates/**",
    "apps/**",
    "ci/**",
    "docs/**",
    "scripts/**",
    "systemd/**",
    "tools/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Flipper FZCO"
SPDX-License-Identifier = "MIT"

# Generated compilation of third-party license texts (see about.hbs). The
# arrangement is ours (MIT); each embedded text is quoted verbatim under its own
# terms, as the file itself states. Use "override" (not "aggregate") so the
# SPDX-License-Identifier lines *inside* the reproduced license texts (e.g. the
# Unicode-3.0 header) are not mistaken for this file's own license.
[[annotations]]
path = "THIRD-PARTY-LICENSES.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Flipper FZCO and the respective crate authors"
SPDX-License-Identifier = "MIT"

# The font collection's own two files: the index that describes what is in it and
# where each font came from, and its ignore list. Ours, and neither is a font.
[[annotations]]
path = [
    "third_party/flipctl-fonts/README.md",
    "third_party/flipctl-fonts/.gitignore",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Flipper Devices Inc."
SPDX-License-Identifier = "MIT"

# HaxrCorp 4090: an adaptation of HaxrCorp 4089 by sahwar, which is ShareAlike, so
# the adaptation is too. The status bar, titles and dialogs are drawn with it.
[[annotations]]
path = [
    "third_party/flipctl-fonts/HaxrCorp4090-FlipCTL/**",
    "crates/flipper-ui/src/font/title.rs",
    "apps/qtdemo/HaxrCorp4090-FlipCTL.ttf",
    "apps/qtdemo2/HaxrCorp4090-FlipCTL.ttf",
]
precedence = "override"
SPDX-FileCopyrightText = "2009 sahwar; 2026 Flipper Devices Inc. (FlipCTL adaptation)"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# Busy9px: ours, drawn for FlipCTL. A menu row at rest is set in it.
[[annotations]]
path = [
    "third_party/flipctl-fonts/Busy9px-FlipCTL/**",
    "crates/flipper-ui/src/font/row.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Flipper Devices Inc.; Busy9px by Yana Odobesku and Lunev Mikhail"
SPDX-License-Identifier = "MIT"

# Born2bSportyV2: public domain upstream, and the FlipCTL glyphs with it. A menu
# row that is selected or pressed is set in it.
[[annotations]]
path = [
    "third_party/flipctl-fonts/Born2bSportyV2-FlipCTL/**",
    "crates/flipper-ui/src/font/row_active.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "JapanYoshi; 2026 Flipper Devices Inc. (FlipCTL glyphs)"
SPDX-License-Identifier = "Unlicense"
