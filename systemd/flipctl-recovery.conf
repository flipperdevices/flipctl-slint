# Installed as flipctl.service.d/50-recovery.conf by the recovery image, which has
# no logind, no sudo and no `user`: flipctl runs as root and opens the panel and the
# buttons itself.
[Service]
User=root
Group=root
PAMName=
SupplementaryGroups=
Environment=HOME=/root
# fbcon is bound to the panel's framebuffer and paints kernel messages over the UI.
ExecStartPre=-/bin/sh -c 'for v in /sys/class/vtconsole/vtcon*; do grep -q "frame buffer" "$$v/name" && echo 0 > "$$v/bind"; done; true'
