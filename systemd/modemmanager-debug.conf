# ModemManager in debug mode, for the 5G Modem app's per-antenna readings: its
# Command() method, which passes an AT command to the modem through MM's own port
# queue, answers "Operation only allowed in debug mode" otherwise. The flag is read
# when MM starts, so it stays on rather than following the page; flipctl only polls
# while the Signal page is open. --log-level=INFO keeps the journal at its usual
# volume, which --debug alone would raise to DEBUG.
#
# What it opens: any process that passes MM's D-Bus policy (Command is on its
# default allow list) and polkit's Device.Control (the active local session, and
# root) can send any AT command through MM. Today that is root and flipctl.
#
# Installed as ModemManager.service.d/50-flipctl-debug.conf: under
# /usr/lib/systemd/system by the image, /etc/systemd/system by build_deploy.sh.
[Service]
ExecStart=
ExecStart=/usr/sbin/ModemManager --debug --log-level=INFO
