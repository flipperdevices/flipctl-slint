# The sound card the uac2 claim makes never drives the audio graph.
#
# Its clock is the PC's: the capture side moves only while the PC plays, and the
# playback side only while it records. As a driver, a PC that pauses stops every
# node in the graph with it, the speaker and the apps included. As a follower it is
# rate-matched to whatever device does drive, and a pause is only its own silence.
monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "UAC2_Gadget"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1
      }
    }
  }
]
