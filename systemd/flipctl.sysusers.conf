# The group 70-flipctl-devices.rules gives the GPIO and SPI nodes to. Named in the
# unit's SupplementaryGroups, and a unit naming a group that does not exist fails to
# start, so this is created at boot by systemd-sysusers rather than left to a deploy.
g gpio -
# The group 70-flipctl-devices.rules gives /dev/rfkill to, for the 5G Modem app's
# radio switch. Named in the unit's SupplementaryGroups too.
g rfkill -
