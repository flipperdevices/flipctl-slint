<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- What flipctl's 5G Modem page asks ModemManager for beyond its own policy.
     ModemManager allows a fixed list of methods to everyone and leaves the rest to
     root; GetCellInfo, the serving cell and so its band, is one of the rest. This
     lets flipctl's user send it. ModemManager still asks polkit before it answers
     (org.freedesktop.ModemManager1.Device.Control, allowed to an active local
     session, which is what flipctl runs in). `user` because that is who
     flipctl.service runs as. Installed as
     /usr/share/dbus-1/system.d/flipctl-modemmanager.conf by the image and as
     /etc/dbus-1/system.d/flipctl-modemmanager.conf by build_deploy.sh. -->
<busconfig>
  <policy user="user">
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem"
           send_member="GetCellInfo"/>
  </policy>
</busconfig>
