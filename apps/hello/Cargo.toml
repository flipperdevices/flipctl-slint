[workspace]

[package]
name = "hello-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
flipctl-app = { path = "../../crates/flipctl-app" }
slint = { version = "1.17", default-features = false, features = [
    "compat-1-2", "backend-winit-wayland", "renderer-software", "std" ] }

[build-dependencies]
flipctl-app = { path = "../../crates/flipctl-app", features = ["build"] }

[profile.release]
opt-level = "z"
strip = true
