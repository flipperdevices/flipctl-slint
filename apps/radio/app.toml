# Internet radio: a stream picked from a list, played on the panel's speaker.
#
# `audio` is what earns it the sound server, and with it the pinned sink: the stream
# comes out of the device rather than out of whatever the desktop last plugged in.
#
# Nothing to install: the stream is fetched, decoded and played in the binary, over
# the sound server every profile has, so the app works the same in all of them.
name = "Internet radio"
# The strip the app draws itself, eight 14px frames: the row animates it while it is
# selected, as the menu does with its own icons.
icon = "assets/internet_radio_animated.png"
wayland = "./target/release/radio-app"
audio = true
