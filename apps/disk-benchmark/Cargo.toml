[workspace]

[package]
name = "disk-benchmark-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
flipctl-app = { path = "../../crates/flipctl-app" }
io-uring = "0.7"
libc = "0.2"
slint = { version = "1.17", default-features = false, features = [
    "compat-1-2", "backend-winit-wayland", "renderer-software", "std" ] }

[dev-dependencies]
flipctl-app = { path = "../../crates/flipctl-app", features = ["render"] }

[build-dependencies]
flipctl-app = { path = "../../crates/flipctl-app", features = ["build"] }

[profile.release]
opt-level = "z"
strip = true
