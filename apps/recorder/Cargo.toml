# Its own workspace, so this crate is independent of whatever it happens to sit
# inside. Without it cargo refuses to build: a crate under a workspace directory
# is assumed to be a member of it.
[workspace]

[package]
name = "recorder-app"
version = "0.1.0"
edition = "2021"
# The source. The binary is a combined work: it links flipctl-app, and so Slint,
# which makes the built app GPL-3.0-only like flipctl itself.
license = "MIT"
publish = false

# Everything the app does with sound is in this binary, below; what is not small
# is the drawing: flipctl-app is the framework, and through it the widgets, the
# panel's fonts and the Slint software renderer.
[dependencies]
flipctl-app = { path = "../../crates/flipctl-app" }
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "backend-winit-wayland", "renderer-software", "std"] }
# poll() on the player's socket, and statvfs for the free space.
libc = "0.2"
# The sound server, over the PulseAudio socket PipeWire serves: capture, playback
# and the two volumes. Pure Rust, so nothing on the device has to be installed.
pulseaudio = { version = "0.3", default-features = false }
# The two encoders, LAME and libvorbis, built from source by `cc` and linked
# statically, so the binary still needs only libc, libm and libgcc_s.
mp3lame-encoder = { version = "0.3", default-features = false, features = ["std"] }
vorbis_rs = { version = "0.5", default-features = false }
minimp3 = "0.6"

# The panel's own renderer, for the tests: they draw the page headlessly and read
# the pixels back, which is the only way to check a layout without the device.
# Tests only, so an app built on the device never compiles it.
[dev-dependencies]
flipper-ui = { path = "../../crates/flipper-ui", default-features = false, features = ["slint"] }
png = "0.17"

[build-dependencies]
flipctl-app = { path = "../../crates/flipctl-app", features = ["build"] }

[profile.release]
opt-level = "z"
strip = true
