# Every Debian package this bundle carries, pinned by checksum.
#
# The app installs nothing: the engine, the game data and all eighty-odd shared
# libraries they need are unpacked into the bundle at build time, so Doom runs on a
# Flipper that has never seen apt. The panel's own glibc and dynamic loader are the
# only things borrowed from the device, because a program cannot bring its own.
#
# Columns: url, sha256, size. Generated on a Flipper running the image this targets:
#
#     ldd /usr/games/dsda-doom | sed -n 's/.*=> \(\/[^ ]*\).*/\1/p' | sed 's#^/lib/#/usr/lib/#' |
#         sort -u | xargs dpkg -S | grep -v ^diversion | cut -d: -f1 | sort -u > pkgs
#     apt-get download --print-uris $(cat pkgs) dsda-doom freedoom
#
# Regenerate it the same way when the image's Debian release moves, and check the
# result still runs with the packages purged.
#
# One package is deliberately absent. libgbm is mesa, built for the Flipper rather
# than by Debian, so pinning it here would tie this build to a private archive for a
# library every device already has: flipctl cannot convert a frame on the GPU without
# it. SDL links it, the loader finds the device's, and nothing in this bundle calls
# into it.
