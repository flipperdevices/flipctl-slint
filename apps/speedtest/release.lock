# The measuring programs this bundle carries, from their projects' own releases,
# pinned by checksum: where each file goes in the bundle, its url, and its sha256.
# Unpacked by tools/appimage/fetch-release.sh; a tarball gives up the member named
# like the destination.
#
# Each is a single binary that needs nothing from the device but its libc: the two
# Go programs are static, and cfspeedtest links glibc and libgcc_s and carries its
# own CA roots. speedtest-go and librespeed-cli publish checksums.txt beside their
# tarballs and the sums below match them; cfspeedtest publishes none, so its sum is
# the one taken when it was first fetched.
#
# speedtest-go replaces Debian's speedtest-cli, which upstream archived in 2024.
# librespeed-cli is newer here than Debian's 1.0.11. librespeed-cli is LGPL-3.0,
# which is a set of permissions on top of the GPL-3.0, so the GPL's text travels too.
