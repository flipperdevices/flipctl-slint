# The Debian packages this bundle carries, pinned by checksum: iperf3 and the
# libraries it loads. Columns: url, sha256, size. Generated on a Flipper running the
# image this targets:
#
#     apt-get download --print-uris iperf3 libiperf0 libsctp1 libssl3t64
#
# iperf3's own debconf and adduser dependencies are for setting up its daemon, which
# a bundle that only ever runs the client has no use for. Regenerate the same way
# when the image's Debian release moves.
