# The upstream pieces a bundle is made with or carries, pinned: name, URL, sha256.
# Fetched into target/appimage/tools by build.sh and checked on every run.
#
# runtime-aarch64 is the type-2 AppImage runtime that heads every bundle; it is what
# a static-pie build of AppImage/type2-runtime produces, and appimagetool takes it
# through --runtime-file. Replacing it with a build of our own is one line here.
#
# uv and the Slint wheel are carried by a runtime bundle rather than used to build
# one: uv reads the dependencies a script declares, and the wheel is how a script
# draws with the panel's own widgets. Every published Slint Python binding is a
# pre-release, so the hash is what pins it rather than the version.
#
# The two slint-node entries are the same thing for JavaScript: the binding, and the
# prebuilt native addon npm would install as a scoped package of its own. That one is
# 29MB unpacked and is the reason a JavaScript app needs no compiler on the device.
